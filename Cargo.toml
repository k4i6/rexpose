[package]
name = "rexpose"
version = "1.3.5"
edition = "2024"
description = "A tunneling proxy to expose TCP and UDP services behind any NAT via a public server."
repository = "https://github.com/k4i6/rexpose"
readme = "README.md"
keywords = ["proxy", "TCP", "UDP"]
categories = ["development-tools", "network-programming", "os", "web-programming"]
license = "MIT"

[dependencies]
clap = { version = "4.6.5", features = ["derive"] }
env_logger = "0.11.11"
log = "0.4.33"
tokio = {version = "1.53.1", features = ["full"]}
tokio-rustls = "0.26.4"
webpki-roots = "1.0.9"
serde = "1.0.229"
rpassword = "7.5.4"
ciborium = "0.2.2"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
